name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm lint:web

      - name: Type-check web application
        run: pnpm typecheck:web

      - name: Test web application
        run: pnpm test:web

      - name: Build web application
        run: pnpm build:web

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install API dependencies
        run: uv sync --locked --all-groups

      - name: Lint API
        run: uv run --locked ruff check app tests alembic/env.py

      - name: Type-check API
        run: uv run --locked mypy app

      - name: Test API
        run: uv run --locked pytest

      - name: Verify Alembic configuration
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv run --locked alembic heads
          uv run --locked alembic current
