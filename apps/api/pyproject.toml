[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "experiment-assistant-api"
version = "0.1.0"
description = "FastAPI backend for Experiment Assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
packages = ["app"]
